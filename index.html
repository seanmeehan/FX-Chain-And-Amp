<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./assets/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.40/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <title>FX Chain with Amp</title>
</head>
<body>
  <h1>FX Chain with Amp</h1>
  <div id="recorder-bar" style="display:flex;gap:12px;align-items:center;justify-content:center;padding:8px;flex-wrap:wrap;">
    <label style="font-size:13px;color:#444;">Input:
      <select id="input-device" class="tb-btn" style="background:#34495e;margin-left:6px;"><option value="">(default)</option></select>
    </label>
    <button id="record-button" class="tb-btn" style="background:#c0392b;">● Record</button>
    <label style="font-size:13px;color:#444;display:flex;align-items:center;gap:6px;">Volume
      <input id="master-volume" type="range" min="-60" max="0" step="0.1" value="-40" style="width:120px;">
      <span id="master-volume-display" style="font-family:monospace;width:48px;text-align:right;">-40 dB</span>
    </label>
    <span id="record-status" style="font-family:monospace;color:#444;">Idle</span>
    <div id="recordings-list" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
  </div>
  <div id="keyboard-panel" style="margin:8px auto;max-width:760px;padding:10px;background:#1a1a1a;border-radius:8px;color:#fff;">
    <div style="display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:8px;">
      <button id="keyboard-toggle" class="tb-btn" style="background:#27ae60;">🎹 Keyboard</button>
      <button id="keyboard-octave-down" class="tb-btn" style="background:#34495e;">◀ Oct</button>
      <span id="keyboard-octave-label" style="font-family:monospace;min-width:60px;text-align:center;">C4–C6</span>
      <button id="keyboard-octave-up" class="tb-btn" style="background:#34495e;">Oct ▶</button>
      <span style="font-size:11px;color:#888;">QWERTY: A S D F G H J K L (white) · W E T Y U O P (black) · Z/X octave</span>
    </div>
    <div id="keyboard" style="display:none;position:relative;height:140px;user-select:none;"></div>
  </div>
  <div id="tuner-panel" style="display:flex;align-items:center;justify-content:center;gap:16px;padding:10px;margin:8px auto;max-width:420px;background:#1a1a1a;color:#fff;border-radius:8px;font-family:monospace;">
    <span style="font-size:11px;letter-spacing:2px;color:#888;">TUNER</span>
    <span id="tuner-note" style="font-size:42px;font-weight:700;min-width:90px;text-align:center;">--</span>
    <div style="display:flex;flex-direction:column;align-items:center;min-width:140px;">
      <span id="tuner-cents" style="font-size:14px;color:#aaa;">— hz</span>
      <div id="tuner-meter" style="position:relative;width:140px;height:8px;background:#333;border-radius:4px;margin-top:4px;">
        <div id="tuner-needle" style="position:absolute;left:50%;top:-2px;width:2px;height:12px;background:#888;transition:left 0.05s,background 0.1s;"></div>
        <div style="position:absolute;left:50%;top:0;width:1px;height:8px;background:#555;"></div>
      </div>
    </div>
  </div>
  <div id="preset-bar" style="display:flex;gap:8px;align-items:center;justify-content:center;padding:8px;flex-wrap:wrap;">
    <button id="save-preset" class="tb-btn">💾 Save preset</button>
    <select id="load-preset" class="tb-btn" style="background:#34495e;"><option value="">Load preset…</option></select>
    <button id="delete-preset" class="tb-btn" style="background:#7f8c8d;">🗑</button>
    <button id="share-preset" class="tb-btn" style="background:#16a085;">🔗 Copy share link</button>
    <button id="tap-tempo" class="tb-btn" style="background:#8e44ad;">⏱ Tap tempo</button>
    <span id="tap-tempo-display" style="font-family:monospace;color:#444;"></span>
  </div>
  <div id="start-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:99999;">
    <button id="start-button" style="font-size:32px;padding:24px 48px;background:#e74c3c;color:white;border:none;border-radius:8px;cursor:pointer;">Start Audio</button>
  </div>
  <div class="audio-container">
    <!-- input meter -->
    <div class="meter-container">
      <div class="sidebar" id="sidebar">
        <div class="meter" id="input-meter"></div>
      </div>
      <label for="input-db-value">INPUT</label>
      <span id="input-db-value"></span>
    </div>

    <!-- global settings and amp -->
    <div class="global-container" id="global-container">
        <div class="amp-container" id="amp-container"></div>
        <div class="power-container" id="power-container">
            <div class="custom-select">
            <label for="amp-type">Select Amp:</label>
            <select id="amp-type">
            <option value="" selected>Select Amp:</option>
        </select>
        </div>
            </div>
    </div>

    <!-- output meter -->
    <div class="meter-container">
      <div class="sidebar" id="sidebar">
        <div class="meter" id="output-meter"></div>
      </div>
      <label for="output-db-value">OUTPUT</label>
      <span id="output-db-value"></span>
    </div>
  </div>
    
  <div class="module-container">
    <!-- fx modules -->
    <div class="fx-module" id="volume-module"></div>
    <div class="fx-module" id="pitchshifter-module"></div>
    <div class="fx-module" id="compressor-module"></div>
    <div class="fx-module" id="autowah-module"></div>
    <div class="fx-module" id="trebleboost-module"></div>
    <div class="fx-module" id="distortion-module"></div>
    <div class="fx-module" id="distortion-module-2"></div>
    <div class="fx-module" id="bitcrusher-module"></div>
    <div class="fx-module" id="chebydistortion-module"></div>
    <div class="fx-module" id="fuzz-module"></div>
    <div class="fx-module" id="chorus-module"></div>
    <div class="fx-module" id="phaser-module"></div>
    <div class="fx-module" id="tremolo-module"></div>
    <div class="fx-module" id="vibrato-module"></div>
    <div class="fx-module" id="delay-module"></div>
    <div class="fx-module" id="pingpong-delay-module"></div>
    <div class="fx-module" id="reverb-module"></div>
    <div class="fx-module" id="jcreverb-module"></div>

    <!-- <div class="fx-module" id="filter-module"></div> -->
    <div class="fx-module fx-module-add" id="add-pedal" title="Add a pedal">+</div>
  </div>
  <div id="pedal-pool" style="display:none;"></div>
  <div id="pedal-picker" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#222;color:#fff;padding:20px;border-radius:8px;z-index:9999;max-height:70vh;overflow-y:auto;min-width:280px;box-shadow:0 8px 32px rgba(0,0,0,0.5);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <strong>Add a pedal</strong>
      <button id="pedal-picker-close" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;">×</button>
    </div>
    <div id="pedal-picker-list" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>
  
</body>
<script type="module">
  console.log("BOOTSTRAP v3 LOADED");
  document.getElementById("start-button").addEventListener("click", async () => {
    console.log("Start clicked");
    await Tone.start();
    console.log("Tone started, context state:", Tone.context.state);
    document.getElementById("start-overlay").remove();
    await import("./assets/app.js");
    console.log("app.js loaded");
  }, { once: true });
</script>
</html>
